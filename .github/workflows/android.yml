name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['package.json', 'apps/mobile/**', 'packages/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21' }
      - run: pnpm install --frozen-lockfile
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build web app and sync into the Android project
        working-directory: apps/mobile
        run: pnpm build && npx cap sync android
      - name: Build debug APK (installable, not for the Play Store)
        working-directory: apps/mobile/android
        env:
          AIT_KEYSTORE_B64: ${{ secrets.AIT_KEYSTORE_B64 }}
          AIT_KEYSTORE_PASSWORD: ${{ secrets.AIT_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$AIT_KEYSTORE_B64" ]; then echo "$AIT_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/ait.keystore"; export AIT_KEYSTORE="$RUNNER_TEMP/ait.keystore"; fi
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk ai-translate-android-v${{ steps.v.outputs.version }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: ai-translate-android-*.apk
      - uses: softprops/action-gh-release@v2
        # Attach to the release of this version (created by CI or by a pushed tag).
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with: { files: ai-translate-android-*.apk, tag_name: 'v${{ steps.v.outputs.version }}', target_commitish: '${{ github.sha }}', make_latest: true }
