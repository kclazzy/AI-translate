name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  web:
    name: TypeScript, extension, mobile web, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r run typecheck
      - name: Interface dictionaries are complete
        run: node packages/core/scripts/i18n-extract.mjs --check
      - name: Unit and pipeline tests (core)
        run: pnpm --filter @ait/core test
      - run: pnpm --filter @ait/extension build
      - run: pnpm --filter @ait/mobile build
      - name: Engine (for the engine e2e)
        working-directory: engine
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      # Branded Chrome 137+ ignores --load-extension; Chrome for Testing keeps it.
      - uses: browser-actions/setup-chrome@v1
        id: chrome
        with: { chrome-version: stable, install-dependencies: true }
      - name: End-to-end tests in Chrome for Testing
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
          E2E_CDP_EXTENSIONS: '1'
        run: |
          # The pinned puppeteer drives old local test browsers; current Chrome needs a current puppeteer.
          pnpm --filter @ait/e2e add -D puppeteer-core@latest
          mkdir -p .test-output
          set -o pipefail
          xvfb-run -a node e2e/extension.e2e.mjs 2>&1 | tee .test-output/e2e-standalone.log
          MODE=engine xvfb-run -a node e2e/extension.e2e.mjs 2>&1 | tee .test-output/e2e-engine.log
          node e2e/mobile.e2e.mjs 2>&1 | tee .test-output/e2e-mobile.log
          xvfb-run -a node e2e/ollama.e2e.mjs 2>&1 | tee .test-output/e2e-ollama.log
          xvfb-run -a node e2e/queue.e2e.mjs 2>&1 | tee .test-output/e2e-queue.log
          xvfb-run -a node e2e/update.e2e.mjs 2>&1 | tee .test-output/e2e-update.log
          xvfb-run -a node e2e/setup.e2e.mjs 2>&1 | tee .test-output/e2e-setup.log
          xvfb-run -a node e2e/chapter.e2e.mjs 2>&1 | tee .test-output/e2e-chapter.log
          xvfb-run -a node e2e/lang.e2e.mjs 2>&1 | tee .test-output/e2e-lang.log
          xvfb-run -a node e2e/power.e2e.mjs 2>&1 | tee .test-output/e2e-power.log
          pnpm --filter @ait/studio test
      - name: Package release files
        run: node scripts/package-release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: release/*.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-output
          path: .test-output/
          include-hidden-files: true

  engine:
    name: Python engine
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install
        working-directory: engine
        run: python -m pip install -e ".[dev]"
      - name: Tests
        working-directory: engine
        run: python -m pytest -q

  release:
    name: GitHub release
    # Tags pushed by hand, or a new version in package.json landing on main.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [web, engine]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          V=$(node -p "require('./package.json').version")
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          # Already published (the desktop file is there): nothing to do for this version.
          if [ "${GITHUB_REF}" = "refs/heads/main" ] && gh release view "v$V" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' 2>/dev/null | grep -q "desktop-v$V.zip"; then echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/download-artifact@v4
        if: steps.v.outputs.skip != '1'
        with: { name: release-web, path: release }
      - uses: softprops/action-gh-release@v2
        if: steps.v.outputs.skip != '1'
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AI Translate ${{ steps.v.outputs.tag }}
          files: release/*.zip
          generate_release_notes: true
          make_latest: true
