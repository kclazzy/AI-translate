name: iOS build

on:
  push:
    branches: [main]
    tags: ['v*']
    paths: ['package.json', 'apps/mobile/**', 'packages/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build web app and sync into the iOS project
        working-directory: apps/mobile
        run: pnpm build && npx cap sync ios
      - name: Build for the simulator (checks that the project compiles)
        working-directory: apps/mobile/ios/App
        run: xcodebuild -project App.xcodeproj -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build an unsigned device app (sign it with your Apple ID via Sideloadly/AltStore, or in Xcode)
        working-directory: apps/mobile/ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          mkdir -p Payload
          cp -R build-device/Build/Products/Release-iphoneos/App.app Payload/
          zip -qr ../../../../ai-translate-ios-unsigned-v${{ steps.v.outputs.version }}.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ai-translate-ios-unsigned-*.ipa
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        with: { files: ai-translate-ios-unsigned-*.ipa, tag_name: 'v${{ steps.v.outputs.version }}', target_commitish: '${{ github.sha }}', make_latest: true }
